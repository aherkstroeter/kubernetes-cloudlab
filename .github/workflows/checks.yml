name: checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  workload-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: workload apps stay on the workloads project
        run: python3 scripts/check-workload-projects.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false
      - name: terraform test
        run: bash scripts/terraform-test.sh
