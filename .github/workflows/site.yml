name: site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: write
  packages: write

jobs:
  image:
    # The tag commit changes the Deployment only. GITHUB_TOKEN does not start
    # another run. This skips that commit if a later path filter includes it.
    if: github.event.head_commit.message != 'MOD set the site image tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: site
          push: true
          tags: ghcr.io/aherkstroeter/www:${{ github.sha }}

      - name: set the image tag
        run: |
          git config user.name "Anselm Herkströter"
          git config user.email "anselmherkstroeter@protonmail.com"
          git pull --rebase origin master
          sed -i -E "s|image: ghcr.io/aherkstroeter/www:.*|image: ghcr.io/aherkstroeter/www:${{ github.sha }}|" \
            02_ArgoCD/03_workloads/www/manifests/deployment.yaml
          if git diff --quiet -- 02_ArgoCD/03_workloads/www/manifests/deployment.yaml; then
            exit 0
          fi
          git add 02_ArgoCD/03_workloads/www/manifests/deployment.yaml
          git commit -m "MOD set the site image tag"
          git push origin HEAD:master
          git push origin HEAD:main
