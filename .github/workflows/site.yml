name: site

on:
  push:
    branches: [master]
    paths:
      - "02_ArgoCD/03_workloads/www/source.txt"
      - ".github/workflows/site.yml"

permissions:
  contents: write
  packages: write

jobs:
  image:
    if: github.event.head_commit.message != 'MOD set the site image tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: read the site sha
        id: source
        run: |
          sha=$(tr -d '[:space:]' < 02_ArgoCD/03_workloads/www/source.txt)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$'

      - uses: actions/checkout@v4
        with:
          repository: aherkstroeter/www
          ref: ${{ steps.source.outputs.sha }}
          path: www

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: www
          push: true
          tags: ghcr.io/aherkstroeter/www:${{ steps.source.outputs.sha }}

      - name: set the image tag
        run: |
          git config user.name "Anselm Herkströter"
          git config user.email "anselmherkstroeter@protonmail.com"
          git pull --rebase origin master
          sed -i -E "s|image: ghcr.io/aherkstroeter/www:.*|image: ghcr.io/aherkstroeter/www:${{ steps.source.outputs.sha }}|" \
            02_ArgoCD/03_workloads/www/manifests/deployment.yaml
          if git diff --quiet -- 02_ArgoCD/03_workloads/www/manifests/deployment.yaml; then
            exit 0
          fi
          git add 02_ArgoCD/03_workloads/www/manifests/deployment.yaml
          git commit -m "MOD set the site image tag"
          git push origin HEAD:master
          git push origin HEAD:main
