# argo-cd 10.18.2. Everything else is the chart default.
# Dex and notifications stay off. TLS ends at the shared Gateway.
# The client secret is the argocd-secret key oidc.google.clientSecret.
# PKCE stays off: this web client has a secret, and Argo CD omits the secret when PKCE is on.
global:
  domain: argocd.lab.anselmherkstroeter.com

configs:
  cm:
    url: https://argocd.lab.anselmherkstroeter.com
    oidc.config: |
      name: Google
      issuer: https://accounts.google.com
      clientID: 367834925918-2hg4oi759ggtshcj8bc8thce12ofr0d3.apps.googleusercontent.com
      clientSecret: $oidc.google.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
    # Terraform owns these. Argo CD must not prune them.
    resourceExclusionsAdditional:
      - apiGroups:
          - metallb.io
        kinds:
          - IPAddressPool
          - L2Advertisement
        clusters:
          - "*"
  params:
    # The ListenerSet terminates TLS. The HTTPRoute proxies to port 80.
    server.insecure: "true"
  rbac:
    # Google's sub claim is a numeric id. Match the email claim.
    policy.csv: |
      g, anselmherkstroter@gmail.com, role:admin
    scopes: "[email]"

dex:
  enabled: false

notifications:
  enabled: false

server:
  certificate:
    enabled: true
    issuer:
      group: cert-manager.io
      kind: ClusterIssuer
      name: letsencrypt
  httproute:
    enabled: true
    hostnames:
      - argocd.lab.anselmherkstroeter.com
  listenerset:
    enabled: true
    parentRef:
      name: lab
      namespace: envoy-gateway-system
      kind: Gateway
      group: gateway.networking.k8s.io
