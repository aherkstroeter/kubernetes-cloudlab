# lab: merge two keys into the Secret the Argo CD chart already owns.
# creationPolicy Merge adds keys and leaves admin.password and server.secretkey.
# deletionPolicy Retain keeps those keys if this object is removed.
# No auth block: the node metadata token is the credential. k3s has no
# Workload Identity. A downloaded service-account JSON key is not a fallback.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp
  namespace: argocd
spec:
  provider:
    gcpsm:
      projectID: project-d5d6243a-0e10-43fb-8c4
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp
    kind: SecretStore
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: oidc.google.clientSecret
      remoteRef:
        key: argocd-oidc-google
    - secretKey: webhook.github.secret
      remoteRef:
        key: argocd-github-webhook
