apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-redirect
spec:
  parentRefs:
    - name: lab
      sectionName: http
  hostnames:
    - argocd.lab.anselmherkstroeter.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab
spec:
  parentRefs:
    - name: lab
      sectionName: https
  hostnames:
    - argocd.lab.anselmherkstroeter.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
