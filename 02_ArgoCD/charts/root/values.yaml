repoURL: https://github.com/aherkstroeter/kubernetes-cloudlab.git
targetRevision: master

# Local charts are grouped by concern: 01_networking, then 02_workloads.
# Storage gets the next number when it exists. Upstream charts are repo references below.
projects:
  platform:
    description: Cluster platform. Networking, certificates, DNS, and Argo CD.
    sourceRepos:
      - https://github.com/aherkstroeter/kubernetes-cloudlab.git
      - https://metallb.github.io/metallb
      - https://charts.jetstack.io
      - https://kubernetes-sigs.github.io/external-dns/
      - https://argoproj.github.io/argo-helm
      - docker.io/envoyproxy
    destinations:
      - namespace: kube-system
      - namespace: metallb-system
      - namespace: argocd
      - namespace: cert-manager
      - namespace: envoy-gateway-system
      - namespace: external-dns
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
  workloads:
    description: Lab workloads.
    sourceRepos:
      - https://github.com/aherkstroeter/kubernetes-cloudlab.git
    destinations:
      - namespace: echo
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace

applications:
  kube-vip:
    project: platform
    namespace: kube-system
    path: 02_ArgoCD/01_networking/kube-vip
    helm:
      releaseName: kube-vip
  metallb:
    project: platform
    namespace: metallb-system
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.16.2
    helm:
      releaseName: metallb
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  cert-manager:
    project: platform
    namespace: cert-manager
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
          keep: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  envoy-gateway:
    project: platform
    namespace: envoy-gateway-system
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.10.0
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    helm:
      releaseName: eg
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  external-dns:
    project: platform
    namespace: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.23.0
    annotations:
      argocd.argoproj.io/sync-wave: "1"
    helm:
      releaseName: external-dns
      values: |
        policy: sync
        registry: txt
        txtOwnerId: gcp-k3s-test-cluster
        sources:
          - gateway-httproute
        domainFilters:
          - lab.anselmherkstroeter.com
        provider:
          name: google
        extraArgs:
          - --google-project=project-d5d6243a-0e10-43fb-8c4
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  argocd:
    project: platform
    namespace: argocd
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.18.2
    annotations:
      argocd.argoproj.io/sync-wave: "1"
    helm:
      releaseName: argocd
      values: |
        dex:
          enabled: false
        notifications:
          enabled: false
        configs:
          cm:
            url: https://argocd.lab.anselmherkstroeter.com
            resourceExclusionsAdditional:
              - apiGroups:
                  - metallb.io
                kinds:
                  - IPAddressPool
                  - L2Advertisement
                clusters:
                  - "*"
          params:
            server.insecure: true
  lab-gateway:
    project: platform
    namespace: argocd
    path: 02_ArgoCD/01_networking/lab-gateway
    annotations:
      argocd.argoproj.io/sync-wave: "2"
    helm:
      releaseName: lab-gateway
  echo:
    project: workloads
    namespace: echo
    path: 02_ArgoCD/02_workloads/echo
    helm:
      releaseName: echo
