apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster platform. Networking, certificates, DNS, secrets, and Argo CD.
  sourceRepos:
    - https://github.com/aherkstroeter/kubernetes-cloudlab.git
    - https://kube-vip.github.io/helm-charts
    - https://metallb.github.io/metallb
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns/
    - https://charts.external-secrets.io
    - https://argoproj.github.io/argo-helm
    - docker.io/envoyproxy
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: metallb-system
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: envoy-gateway-system
    - server: https://kubernetes.default.svc
      namespace: external-dns
    - server: https://kubernetes.default.svc
      namespace: external-secrets
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Lab workloads.
  sourceRepos:
    - https://github.com/aherkstroeter/kubernetes-cloudlab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: echo
    - server: https://kubernetes.default.svc
      namespace: www
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
