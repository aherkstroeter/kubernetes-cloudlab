apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/aherkstroeter/kubernetes-cloudlab.git
    targetRevision: master
    path: 02_ArgoCD/appsets
    # projects/ is a subdirectory. Directory apps skip subdirectories unless
    # recurse is set, and the locked default project lives in that subdirectory.
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
