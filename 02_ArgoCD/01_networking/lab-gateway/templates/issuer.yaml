apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuerName }}
spec:
  acme:
    email: {{ .Values.acmeEmail | quote }}
    server: {{ .Values.acmeServer | quote }}
    privateKeySecretRef:
      name: {{ .Values.issuerName }}-account
    solvers:
      - dns01:
          cloudDNS:
            project: {{ .Values.project | quote }}
            hostedZoneName: {{ .Values.hostedZoneName | quote }}
