# Shared edge for *.lab.anselmherkstroeter.com. Apps attach their own HTTPS
# listeners with a ListenerSet. This Gateway does not grow one listener per app.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
spec:
  gatewayClassName: eg
  allowedListeners:
    namespaces:
      from: All
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.anselmherkstroeter.com"
      allowedRoutes:
        namespaces:
          from: Same
