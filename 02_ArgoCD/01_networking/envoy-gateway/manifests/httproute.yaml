# Redirect every lab hostname to HTTPS. The annotation keeps external-dns from
# publishing a wildcard; each app route publishes its own name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  annotations:
    external-dns.kubernetes.io/gateway-hostname-source: annotation-only
spec:
  parentRefs:
    - name: lab
      sectionName: http
  hostnames:
    - "*.lab.anselmherkstroeter.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
