# gateway-crds-helm v1.10.0.
# k3s already installed Gateway API standard channel, including ListenerSet.
# The chart default channel is experimental, which the cluster rejects.
# The controller still needs the Envoy CRDs. Gateway API does not ship them.
crds:
  gatewayAPI:
    enabled: false
    channel: standard
  envoyGateway:
    enabled: true
