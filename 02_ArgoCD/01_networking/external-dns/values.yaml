# external-dns 1.23.0. Cloud DNS, policy sync, TXT ownership.
# A record with no TXT for this owner is left alone. Delete that A record
# when this instance should create it.
# The zone filter is the apex. lab.anselmherkstroeter.com matches no Cloud DNS zone.
enableGatewayListenerSets: true
sources:
  - service
  - gateway-httproute
  - crd
policy: sync
txtOwnerId: gcp-k3s-test-cluster
domainFilters:
  - anselmherkstroeter.com
provider:
  name: google
extraArgs:
  - --google-project=project-d5d6243a-0e10-43fb-8c4
