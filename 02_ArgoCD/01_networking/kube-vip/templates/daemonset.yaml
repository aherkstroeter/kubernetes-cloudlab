apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
    spec:
      serviceAccountName: kube-vip
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: kube-vip
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - manager
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_TIME
          env:
            # ARP cannot publish a GCP public address. Routing-table mode with a
            # local route keeps the API address on lo. The passthrough rule publishes it.
            - name: vip_arp
              value: "false"
            - name: vip_routingtable
              value: "true"
            - name: vip_routingtabletype
              value: "2"
            - name: vip_interface
              value: lo
            - name: vip_subnet
              value: "32"
            - name: vip_leaderelection
              value: "true"
            - name: vip_preserve_on_leadership_loss
              value: "true"
            - name: vip_leaseduration
              value: "5"
            - name: vip_renewdeadline
              value: "3"
            - name: vip_retryperiod
              value: "1"
            - name: cp_enable
              value: "true"
            - name: cp_namespace
              value: kube-system
            - name: svc_enable
              value: "false"
            - name: port
              value: "6443"
            - name: address
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configMap | quote }}
                  key: {{ .Values.configKey | quote }}
