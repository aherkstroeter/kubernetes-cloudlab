# kube-vip 0.11.2. The image is pinned to v1.3.2 because the chart appVersion is v1.2.4.
# config.address is a placeholder. The chart copies it into the pod when control-plane
# mode is on. The address that is used comes from ConfigMap lab-addresses.
image:
  tag: "v1.3.2"

config:
  address: "from-configmap"

env:
  vip_interface: "lo"
  vip_arp: "false"
  vip_routingtable: "true"
  vip_routingtabletype: "2"
  vip_subnet: "32"
  vip_leaderelection: "true"
  vip_preserve_on_leadership_loss: "true"
  vip_leaseduration: "5"
  vip_renewdeadline: "3"
  vip_retryperiod: "1"
  lb_enable: "false"
  cp_enable: "true"
  cp_namespace: "kube-system"
  svc_enable: "false"
  port: "6443"

envValueFrom:
  address:
    configMapKeyRef:
      name: lab-addresses
      key: apiAddress

securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW
      - SYS_TIME

# Control-plane nodes only. The tolerations cover a control-plane taint and a NoExecute taint.
tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
        - matchExpressions:
            - key: node-role.kubernetes.io/master
              operator: Exists
